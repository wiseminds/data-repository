name: data_repository
description: A repository layer for Flutter that unifies typed HTTP requests, interceptors, response caching, pagination and error normalisation behind one API.
version: 1.0.0
repository: https://github.com/wiseminds/data-repository
homepage: https://wiseminds.github.io/data-repository/
issue_tracker: https://github.com/wiseminds/data-repository/issues
documentation: https://pub.dev/documentation/data_repository/latest/

topics:
  - networking
  - http
  - rest
  - cache
  - api

environment:
  # Floors are set by the upgraded path_provider chain
  # (path_provider_foundation 2.6.0); http/mime alone would allow Dart 3.4.
  sdk: ^3.10.3
  flutter: ">=3.38.4"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  mime: ^2.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
